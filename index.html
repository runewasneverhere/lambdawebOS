<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lambdawebOS</title>
  <link rel="icon" type="image/png" href="lambdaweb/lambda-black.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="lambdaweb.css">
  <link rel="stylesheet" href="lambdaweb-social.css">

  <link rel="stylesheet" href="lambdaweb-system.css">
</head>
<body>

  <script src="lambdaweb-system.js"></script>
  <script src="lambdaweb-network.js"></script>

  <script src="lambdaweb-gui-apps.js"></script>

  <script src="lambdaweb-media.js"></script>
  <script src="lambdaweb-mail.js"></script>
  <script src="lambdaweb-admin.js"></script>

  <script src="lambdaweb-account.js"></script>

</html>
